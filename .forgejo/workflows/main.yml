name: Run quality checks
enable-email-notifications: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  run-checks:
    runs-on: podman
    container: docker.io/library/node:20
    name: Run checks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # - name: Create .env File
      #   run: cp .env.example .env
      #
      # - name: Install Dependencies
      #   run: npm ci
      #
      # - name: Run Vitest Tests
      #   run: npm run test run
      #
      # - name: Run TypeScript Check
      #   run: npm run check
      #
      # - name: Run Prettier Check
      #   run: npm run prettier-check

      - name: Push changes to GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git fetch --unshallow --tags origin || git fetch --tags origin
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > ~/.git-credentials
          git remote add github https://github.com/tab-guardian/tab-guardian.git
          git push --prune --force github \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
